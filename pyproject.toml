[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-docx"
dynamic = ["version"]
authors = [
    {name = "Steve Canny", email = "stcanny@gmail.com"},
    {name = "Paper Instruments, Inc."},
]
maintainers = [{name = "Paper Instruments, Inc."}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "lxml>=3.1.0",
    "typing_extensions>=4.9.0",
]
description = "Create, read, and update Microsoft Word .docx files."
keywords = ["docx", "office", "openxml", "word"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "Jinja2>=3.1.6,<4; python_version >= '3.10'",
    "MarkupSafe>=2.1.3,<4; python_version >= '3.10'",
    "Sphinx>=7.4.7,<8; python_version >= '3.10'",
    "alabaster>=0.7.14,<0.8; python_version >= '3.10'",
    "behave>=1.2.6",
    "pyparsing>=3.2.3",
    "pyright>=1.1.401",
    "pytest>=8.4.0",
    "ruff>=0.11.13",
    "tox>=4.26.0; python_version >= '3.10'",
    "twine>=6.1.0; python_version >= '3.10'",
    "types-lxml-multi-subclass>=2025.3.30",
]

[project.urls]
Changelog = "https://github.com/The-LLM-Data-Company/paper-docx/blob/main/HISTORY.rst"
Documentation = "https://github.com/The-LLM-Data-Company/paper-docx"
Homepage = "https://github.com/The-LLM-Data-Company/paper-docx"
Issues = "https://github.com/The-LLM-Data-Company/paper-docx/issues"
Repository = "https://github.com/The-LLM-Data-Company/paper-docx"

[project.scripts]
paper-docx-doctor = "paper_docx_doctor:main"

[tool.setuptools.dynamic]
version = {attr = "docx._version.__paper_version__"}

[tool.pyright]
include = ["src/docx", "tests"]
pythonPlatform = "All"
pythonVersion = "3.9"
reportImportCycles = false
reportUnnecessaryCast = true
reportUnnecessaryTypeIgnoreComment = true
stubPath = "./typings"
typeCheckingMode = "strict"
verboseOutput = true
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
filterwarnings = [
    # -- exit on any warning not explicitly ignored here --
    "error",

    # -- pytest-xdist plugin may warn about `looponfailroots` deprecation --
    "ignore::DeprecationWarning:xdist",

    # -- pytest complains when pytest-xdist is not installed --
    "ignore:Unknown config option. looponfailroots:pytest.PytestConfigWarning",
]
looponfailroots = ["src", "tests"]
norecursedirs = [
    "doc",
    "docx",
    "*.egg-info",
    "features",
    ".git",
    "ref",
    "_scratch",
    ".tox",
]
python_files = ["test_*.py"]
python_classes = ["Test", "Describe"]
python_functions = ["it_", "its_", "they_", "and_", "but_"]

[tool.ruff]
exclude = []
line-length = 100
target-version = "py38"

[tool.ruff.lint]
ignore = [
    "COM812",   # -- over-aggressively insists on trailing commas where not desired --
    "PT001",    # -- wants @pytest.fixture() instead of @pytest.fixture --
]
select = [
    "C4",       # -- flake8-comprehensions --
    "COM",      # -- flake8-commas --
    "E",        # -- pycodestyle errors --
    "F",        # -- pyflakes --
    "I",        # -- isort (imports) --
    "PLR0402",  # -- Name compared with itself like `foo == foo` --
    "PT",       # -- flake8-pytest-style --
    "SIM",      # -- flake8-simplify --
    "UP015",    # -- redundant `open()` mode parameter (like "r" is default) --
    "UP018",    # -- Unnecessary {literal_type} call like `str("abc")`. (rewrite as a literal) --
    "UP032",    # -- Use f-string instead of `.format()` call --
    "UP034",    # -- Avoid extraneous parentheses --
]

[tool.ruff.lint.isort]
known-first-party = ["docx"]
known-local-folder = ["helpers"]
